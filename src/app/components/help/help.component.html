<div class="container pt-3">
    <div class="row">
        <!--Breadcrumb-->
        <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="#" style="color: black;" routerLink="/">
                        <i class="fa fa-house"></i>
                    </a>
                </li>

                <li class="breadcrumb-item active" aria-current="page">
                    <a href="#" class="text-decoration-none" style="color: black;" routerLink="/help">yardım

                    </a>
                </li>
            </ol>
        </nav>

        <div class="col-6">
            <span class="h5">Destek Talebi Oluştur</span>
            <form>
                <div class="form-group">
                    <input type="text" class="form-control mt-3" placeholder="Ad Soyad" required>
                    <input type="tel" class="form-control mt-3" id="phoneInput" placeholder="Telefon Numarası"
                        [value]="phoneNumber" (input)="onPhoneInput($event)" autocomplete="tel" required>
                    <input type="email" class="form-control mt-3" placeholder="E-posta Adresi" required>
                    <textarea class="form-control mt-3" placeholder="Mesaj" required></textarea>
                    <label class="label-box px-2">Bizimle</label>
                </div>
            </form>
        </div>
    </div>
</div>
